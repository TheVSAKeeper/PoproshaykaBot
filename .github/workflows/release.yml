name: Release

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      force:
        description: Выпустить, даже если релиз этой версии уже существует
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.decide.outputs.should_release }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' Directory.Build.props | head -1)
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Directory.Build.props: непригодная версия «$VERSION»"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify changelog entry
        shell: bash
        run: bash .github/changelog-section.sh "${{ steps.version.outputs.VERSION }}" >/dev/null

      - name: Decide if release is needed
        id: decide
        shell: bash
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif ! gh release view "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    if: >
      needs.prepare.outputs.should_release == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, x86 ]
    defaults:
      run:
        working-directory: ./PoproshaykaBot.Wpf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish framework-dependent
        run: >
          dotnet publish PoproshaykaBot.Wpf.csproj
          --configuration Release
          --runtime win-${{ matrix.arch }}
          --output .\publish\framework-dependent
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:UpdatableBuild=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --no-self-contained

      - name: Publish portable
        run: >
          dotnet publish PoproshaykaBot.Wpf.csproj
          --configuration Release
          --runtime win-${{ matrix.arch }}
          --output .\publish\portable
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PortableMode=true
          -p:UpdatableBuild=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --self-contained

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          New-Item -ItemType Directory -Path ".\artifacts" -Force | Out-Null
          Rename-Item -Path ".\publish\framework-dependent\PoproshaykaBot.Wpf.exe" -NewName "PoproshaykaBot-v$version-$arch.exe"
          Rename-Item -Path ".\publish\portable\PoproshaykaBot.Wpf.exe" -NewName "PoproshaykaBot-v$version-$arch-portable.exe"
          Move-Item -Path ".\publish\framework-dependent\PoproshaykaBot-v$version-$arch.exe" -Destination ".\artifacts\"
          Move-Item -Path ".\publish\portable\PoproshaykaBot-v$version-$arch-portable.exe" -Destination ".\artifacts\"
          Compress-Archive -Path ".\artifacts\PoproshaykaBot-v$version-$arch.exe" -DestinationPath ".\artifacts\PoproshaykaBot-v$version-$arch.zip"
          Compress-Archive -Path ".\artifacts\PoproshaykaBot-v$version-$arch-portable.exe" -DestinationPath ".\artifacts\PoproshaykaBot-v$version-$arch-portable.zip"
          Get-ChildItem ".\artifacts\*.exe", ".\artifacts\*.zip" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content ".\artifacts\SHA256SUMS-$arch.txt" -Encoding ascii
          $tfm = (Select-String -Path ".\PoproshaykaBot.Wpf.csproj" -Pattern '<TargetFramework>(.*?)</TargetFramework>').Matches[0].Groups[1].Value
          Set-Content ".\artifacts\RUNTIME-$arch.txt" -Value $tfm -Encoding ascii -NoNewline

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: PoproshaykaBot.Wpf/artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ prepare, build ]
    if: >
      needs.prepare.outputs.should_release == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip

      - name: Render release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          REPO="${{ github.server_url }}/${{ github.repository }}"
          SLUG="${{ github.repository }}"

          PREV_TAG=$(gh release list --exclude-drafts --limit 20 --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -vx "v${VERSION}" | head -1 || true)
          if [ -z "$PREV_TAG" ] || ! git rev-parse -q --verify "refs/tags/$PREV_TAG^{commit}" >/dev/null 2>&1; then
            PREV_TAG=$(git tag --merged HEAD^ --sort=-v:refname 'v*' | grep -vx "v${VERSION}" | head -1 || true)
          fi
          PREV_VERSION="${PREV_TAG#v}"

          COMMITS=$(git log --no-merges --pretty='- %s' "${PREV_TAG:+$PREV_TAG..}HEAD" || true)
          COMMIT_COUNT=$(printf '%s' "$COMMITS" | grep -c '^- ' || true)

          {
            sed -e "s|__VERSION__|$VERSION|g" -e "s|__REPO__|$REPO|g" -e "s|__SLUG__|$SLUG|g" .github/release-body.md
            echo
            echo "## Изменения"
            echo
            bash .github/changelog-section.sh "$VERSION" "$PREV_VERSION" CHANGELOG.md
            echo
            echo "## Технические изменения"
            echo
            echo "<details>"
            echo "<summary>Коммиты ($COMMIT_COUNT)</summary>"
            echo
            printf '%s\n' "$COMMITS"
            echo
            echo "</details>"
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Полный список:** $REPO/compare/$PREV_TAG...v$VERSION"
            fi
          } > release-body.rendered.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: PoproshaykaBot v${{ needs.prepare.outputs.version }}
          files: artifacts/*
          body_path: release-body.rendered.md

  status:
    needs: [ prepare, build, publish ]
    if: always() && needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write

    steps:
      - name: Report status on commit
        shell: bash
        run: |
          if [[ "${{ needs.publish.result }}" == "success" ]]; then
            STATE=success
            DESCRIPTION="v${{ needs.prepare.outputs.version }} опубликован"
          else
            STATE=failure
            DESCRIPTION="Релиз v${{ needs.prepare.outputs.version }} не собран"
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ needs.prepare.outputs.sha }}" \
            -f state="$STATE" \
            -f context=Release \
            -f description="$DESCRIPTION" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
